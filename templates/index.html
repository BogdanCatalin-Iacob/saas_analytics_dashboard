<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Analytics Dashboard</title>
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex">
    <!-- sidebar nav -->
    <aside class="w-64 bg-gray-950 p-6 flex flex-col justify-between hidden md:flex border-r border-gray-800">
        <div>
            <div class="flex items-center gap-3 mb-8">
                <div class="h-8 w-8 bg-blue-500 rounded-lg flex items-center justify-center font-bold text-white">S
                </div>
                <span class="text-xl font-bold tracking-wide text-white">SaaS Analytics</span>
            </div>
            <nav class="space-y-2">
                <a href="#"
                    class="flex items-center gap-3 px-4 py-2.5 bg-blue-600/10 text-blue-400 rounded-lg font-medium">Dashboard</a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-2.5 text-gray-400 hover:bg-gray-800 hover:text-gray-200 rounded-lg transition">Billing</a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-2.5 text-gray-400 hover:bg-gray-800 hover:text-gray-200 rounded-lg transition">User</a>
            </nav>
        </div>
        <div class="text-xs text-gray-500 border-t border-gray-800 pt-4">v1.0.0 // Flask + JS stack</div>
    </aside>

    <!-- main content -->
    <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full">
        <!-- top header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Analytics overview</h1>
                <p class="text-gray-400 text-sm mt-1">Live data polling active.</p>
            </div>
            <button id="refresh-btn"
                class="bg=gray-800 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-lg border border-gray-700 transition flex items-center gap-2 cursor-pointer">
                🔄 Sync now
            </button>
        </header>

        <!-- metric grid cards -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-950 p-6 rounded-xl border border-gray-800 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wide">Monthly Recurring Revenue</p>
                <p id="mrr-val" class="text-3xl font-bold text-white mt-2 animate-pulse">Loading...</p>
                <span id="growth-val" class="text-xs text-green-400 font-medium mt-1 inline-block">4.2% live growth</span>
            </div>
            <div class="bg-gray-950 p-6 rounded-xl border border-gray-800 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wide">Active Customers</p>
                <p id="users-val" class="text-3xl font-bold text-white mt-2 animate-pulse">Loading...</p>
                <span class="text-xs text-green-400 font-medium mt-1 inline-block">Live tracking active</span>
            </div>
            <div class="bg-gray-950 p-6 rounded-xl border border-gray-800 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wide">LTV to CAC Ratio</p>
                <p id="conversion-val" class="text-3xl font-bold text-white mt-2 animate-pulse">Loading...</p>
                <span class="text-xs text-gray-500 font-medium mt-1 inline-block">Healthy Threshold (>3.0)</span>
            </div>
        </section>

        
    </main>

</body>

</html>
